[package]
name = "skopos"
version = "0.1.0"
description = "Skopos desktop application"
authors = ["Skopos"]
edition = "2021"

[features]
e2e = ["dep:tauri-plugin-wdio", "dep:tauri-plugin-wdio-webdriver"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "skopos_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
dotenvy = "0.15"
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.23"
grammers-client = { version = "0.10", features = ["html"] }
grammers-session = "0.10"
libsql = { version = "0.9.30", default-features = false, features = ["core"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "=2.11.5", features = ["tray-icon"] }
tauri-plugin-autostart = "=2.5.1"
tauri-plugin-single-instance = "=2.4.0"
chrono = { version = "0.4", features = ["clock"] }
tauri-plugin-opener = "2"
tauri-plugin-notification = "=2.3.3"
tauri-plugin-wdio = { version = "1.4.0", optional = true }
tauri-plugin-wdio-webdriver = { version = "1.4.0", optional = true }
tokio = { version = "1", features = ["sync", "time", "rt", "macros"] }

[dev-dependencies]
serde_json = "1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage)'] }

[lints.clippy]
cognitive_complexity = "warn"
excessive_nesting = "warn"
too_many_arguments = "warn"
manual_let_else = "warn"
redundant_else = "warn"
unnested_or_patterns = "warn"
cloned_instead_of_copied = "warn"
flat_map_option = "warn"
inefficient_to_string = "warn"
map_unwrap_or = "warn"
