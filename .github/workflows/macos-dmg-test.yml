name: macOS DMG test build

on:
  push:
    branches: [codex/macos-dmg-test]

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - run: npm install --global pnpm@11.9.0
      - run: pnpm install --frozen-lockfile
      - run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - run: pnpm tauri build --target universal-apple-darwin --bundles dmg
      - name: Verify universal executable and disk image
        run: |
          lipo -verify_arch arm64 x86_64 src-tauri/target/universal-apple-darwin/release/bundle/macos/Skopos.app/Contents/MacOS/skopos
          for dmg in src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg; do
            hdiutil verify "$dmg"
          done
      - uses: actions/upload-artifact@v7
        with:
          name: Skopos-macOS-universal
          path: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error
