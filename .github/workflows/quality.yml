name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - run: npm install --global pnpm@11.9.0
      - run: pnpm install --frozen-lockfile
      - run: rustup component add rustfmt
      - run: pnpm check:frontend

  rust:
    runs-on: windows-latest
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/src-tauri/target/ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - run: npm install --global pnpm@11.9.0
      - run: pnpm install --frozen-lockfile
      - run: rustup component add clippy rustfmt llvm-tools-preview
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: |
            src-tauri -> target/ci
            src-tauri -> target/llvm-cov-target
          cache-on-failure: true
      - uses: taiki-e/install-action@861a07ce7084f55488e375df125cdc99bba60eb7 # v2
        with:
          tool: cargo-llvm-cov@0.9.1
      # Native coverage includes the complete unit and desktop E2E suites.
      - run: pnpm check:native
      - name: Save combined Rust coverage report
        if: ${{ !cancelled() && hashFiles('src-tauri/target/llvm-cov-target/llvm-cov/html/index.html') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: rust-coverage
          path: src-tauri/target/llvm-cov-target/llvm-cov/html
      - run: pnpm tauri build --no-bundle

  # Preserve the existing required status without building and running the suite twice.
  desktop-e2e:
    needs: rust
    runs-on: ubuntu-latest
    steps:
      - name: Confirm combined desktop verification
        run: echo "Desktop E2E passed in the Rust coverage job."
