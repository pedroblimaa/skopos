  # Puppeteer 3 removes extract-zip, which has no patched npm release.
  "@wdio/utils>@puppeteer/browsers@2": ^3.2.3
  # Mocha 10 still requests the vulnerable serializer major.
  "mocha>serialize-javascript@6": ^7.1.1
